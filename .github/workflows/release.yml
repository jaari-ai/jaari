name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<sha>          # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@<sha>      # v5
        with: { python-version: "3.12" }
      - run: python -m pip install build && python -m build python --outdir dist/pypi
      # npm packages are added here in Phase 0: pnpm build, then
      # pnpm pack into dist/npm/ for each publishable package.
      - uses: actions/upload-artifact@<sha>   # v4
        with: { name: dist, path: dist/ }

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@<sha> # v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@<sha>   # release/v1; attestations are on by default
        with: { packages-dir: dist/pypi/ }
